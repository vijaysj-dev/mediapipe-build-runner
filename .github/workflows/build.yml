name: Build Windows MediaPipe

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022

    steps:

      # ---------------------------------------------------------
      # Checkout
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # ---------------------------------------------------------
      # Python
      # ---------------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"


      # ---------------------------------------------------------
      # MSYS2
      # ---------------------------------------------------------
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            make
            patch
            diffutils


      # ---------------------------------------------------------
      # Bazelisk
      # ---------------------------------------------------------
      - name: Install Bazelisk
        shell: powershell
        run: |
          choco install bazelisk -y

          Write-Host "Bazel version:"
          bazel --version


      # ---------------------------------------------------------
      # Install official Swift for Windows
      # ---------------------------------------------------------
      - name: Install Swift
        shell: powershell
        run: |

          $swiftUrl = "https://download.swift.org/swift-6.3.3-release/windows10/swift-6.3.3-RELEASE/swift-6.3.3-RELEASE-windows10.exe"

          $installer = "$env:RUNNER_TEMP\swift-installer.exe"

          Write-Host "Downloading Swift..."
          Invoke-WebRequest `
            -Uri $swiftUrl `
            -OutFile $installer

          if (-not (Test-Path $installer)) {
            Write-Error "Swift installer was not downloaded."
            exit 1
          }

          Write-Host "Installing Swift..."
          Start-Process `
            -FilePath $installer `
            -ArgumentList "/quiet", "/install" `
            -Wait `
            -NoNewWindow

          Write-Host "Swift installation completed."


      # ---------------------------------------------------------
      # Locate Swift compiler
      # ---------------------------------------------------------
      - name: Locate Swift compiler
        shell: powershell
        run: |

          Write-Host "Searching for swiftc.exe..."

          $locations = @(
            "$env:ProgramFiles\Swift",
            "$env:ProgramFiles\Swift\Toolchains",
            "$env:LOCALAPPDATA\Programs\Swift"
          )

          $swiftc = $null

          foreach ($location in $locations) {

            if (Test-Path $location) {

              $swiftc = Get-ChildItem `
                -Path $location `
                -Filter "swiftc.exe" `
                -Recurse `
                -ErrorAction SilentlyContinue |
                Select-Object -First 1

              if ($swiftc) {
                break
              }
            }
          }

          if (-not $swiftc) {
            Write-Host ""
            Write-Host "Swift installation directory:"
            Get-ChildItem "$env:ProgramFiles\Swift" `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object -First 100

            Write-Error "swiftc.exe was not found."
            exit 1
          }

          Write-Host "Found swiftc:"
          Write-Host $swiftc.FullName

          $swiftBin = $swiftc.Directory.FullName

          Write-Host "Swift bin:"
          Write-Host $swiftBin

          # Add Swift compiler to the PATH of subsequent steps
          echo "$swiftBin" >> $env:GITHUB_PATH


      # ---------------------------------------------------------
      # Verify Swift
      # ---------------------------------------------------------
      - name: Verify Swift
        shell: powershell
        run: |

          Write-Host "PATH:"
          $env:PATH

          Write-Host ""
          Write-Host "swiftc location:"

          where.exe swiftc

          if ($LASTEXITCODE -ne 0) {
            Write-Error "swiftc.exe is not in PATH."
            exit 1
          }

          Write-Host ""
          Write-Host "Swift version:"

          swiftc --version


      # ---------------------------------------------------------
      # Clone MediaPipe
      # ---------------------------------------------------------
      - name: Clone MediaPipe
        shell: powershell
        run: |

          git clone `
            --depth 1 `
            --branch v0.10.21 `
            https://github.com/google-ai-edge/mediapipe.git


      # ---------------------------------------------------------
      # Configure Bazel environment
      # ---------------------------------------------------------
      - name: Configure Bazel environment
        shell: powershell
        run: |

          echo "BAZEL_SH=C:\msys64\usr\bin\bash.exe" >> $env:GITHUB_ENV

          $vsPaths = @(
            "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC",
            "C:\Program Files\Microsoft Visual Studio\2022\Professional\VC",
            "C:\Program Files\Microsoft Visual Studio\2022\Community\VC"
          )

          $found = $false

          foreach ($path in $vsPaths) {

            if (Test-Path $path) {

              Write-Host "Visual C++ toolchain found:"
              Write-Host $path

              echo "BAZEL_VC=$path" >> $env:GITHUB_ENV

              $found = $true
              break
            }
          }

          if (-not $found) {
            Write-Error "Visual Studio C++ toolchain was not found."
            exit 1
          }


      # ---------------------------------------------------------
      # Verify build environment
      # ---------------------------------------------------------
      - name: Verify build environment
        shell: powershell
        run: |

          Write-Host "=============================="
          Write-Host "Python"
          Write-Host "=============================="
          python --version

          Write-Host ""
          Write-Host "=============================="
          Write-Host "Bazel"
          Write-Host "=============================="
          bazel --version

          Write-Host ""
          Write-Host "=============================="
          Write-Host "Swift"
          Write-Host "=============================="
          swiftc --version

          Write-Host ""
          Write-Host "=============================="
          Write-Host "MSYS2"
          Write-Host "=============================="

          if (-not (Test-Path "C:\msys64\usr\bin\bash.exe")) {
            Write-Error "MSYS2 bash.exe was not found."
            exit 1
          }

          Write-Host "MSYS2 OK"


      # ---------------------------------------------------------
      # Build MediaPipe Hand Tracking
      # ---------------------------------------------------------
      - name: Build MediaPipe Hand Tracking CPU
        shell: cmd
        working-directory: mediapipe
        run: |

          bazel build ^
            -c opt ^
            --define MEDIAPIPE_DISABLE_GPU=1 ^
            --enable_runfiles ^
            --features=compiler_param_file ^
            //mediapipe/examples/desktop/hand_tracking:hand_tracking_cpu


      # ---------------------------------------------------------
      # Show output
      # ---------------------------------------------------------
      - name: Show build output
        shell: powershell
        run: |

          Write-Host ""
          Write-Host "=============================="
          Write-Host "EXE"
          Write-Host "=============================="

          Get-ChildItem `
            "mediapipe\bazel-bin" `
            -Recurse `
            -Filter "*.exe" `
            -ErrorAction SilentlyContinue


          Write-Host ""
          Write-Host "=============================="
          Write-Host "DLL"
          Write-Host "=============================="

          Get-ChildItem `
            "mediapipe\bazel-bin" `
            -Recurse `
            -Filter "*.dll" `
            -ErrorAction SilentlyContinue


          Write-Host ""
          Write-Host "=============================="
          Write-Host "LIB"
          Write-Host "=============================="

          Get-ChildItem `
            "mediapipe\bazel-bin" `
            -Recurse `
            -Filter "*.lib" `
            -ErrorAction SilentlyContinue


      # ---------------------------------------------------------
      # Upload artifacts
      # ---------------------------------------------------------
      - name: Upload MediaPipe binaries
        uses: actions/upload-artifact@v4
        with:
          name: mediapipe-windows-hand-tracking
          path: |
            mediapipe/bazel-bin/**/*.exe
            mediapipe/bazel-bin/**/*.dll
            mediapipe/bazel-bin/**/*.lib
          if-no-files-found: warn
          retention-days: 14
