name: Build MediaPipe Hand Tracking

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:

      # --------------------------------------------------
      # 1. Checkout our repository
      # --------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4


      # --------------------------------------------------
      # 2. Install Python
      # --------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"


      # --------------------------------------------------
      # 3. Install MSYS2
      # --------------------------------------------------
      - name: Install MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true


      # --------------------------------------------------
      # 4. Install Bazelisk
      # --------------------------------------------------
      - name: Install Bazelisk
        shell: powershell
        run: |
          choco install bazelisk -y


      # --------------------------------------------------
      # 5. Clone MediaPipe
      # --------------------------------------------------
      - name: Clone MediaPipe
        shell: powershell
        run: |
          git clone --depth 1 https://github.com/google-ai-edge/mediapipe.git C:\mediapipe


      # --------------------------------------------------
      # 6. Download OpenCV
      #
      # IMPORTANT:
      # We DO NOT run the OpenCV installer.
      #
      # We download the installer and extract its contents
      # using 7-Zip.
      # --------------------------------------------------
      - name: Download OpenCV
        shell: powershell
        run: |
          $url = "https://github.com/opencv/opencv/releases/download/4.5.5/opencv-4.5.5-vc14_vc15.exe"

          Invoke-WebRequest `
            -Uri $url `
            -OutFile C:\opencv.exe

          Write-Host "OpenCV downloaded."


      # --------------------------------------------------
      # 7. Extract OpenCV installer
      # --------------------------------------------------
      - name: Extract OpenCV
        shell: powershell
        run: |
          choco install 7zip -y

          New-Item -ItemType Directory -Force -Path C:\opencv | Out-Null

          & "C:\Program Files\7-Zip\7z.exe" x `
            C:\opencv.exe `
            -oC:\opencv `
            -y

          Write-Host "OpenCV extracted."

          Write-Host "Contents of C:\opencv:"
          Get-ChildItem C:\opencv -Recurse -Depth 2


      # --------------------------------------------------
      # 8. Find the actual OpenCV build directory
      #
      # The archive can contain:
      #
      # C:\opencv\build
      #
      # or
      #
      # C:\opencv\opencv\build
      #
      # We normalize it to:
      #
      # C:\opencv\build
      # --------------------------------------------------
      - name: Normalize OpenCV directory
        shell: powershell
        run: |
          $build = Get-ChildItem C:\opencv -Directory -Recurse |
            Where-Object {
              $_.Name -eq "build" -and
              (Test-Path "$($_.FullName)\include")
            } |
            Select-Object -First 1

          if ($null -eq $build) {
            Write-Host "ERROR: OpenCV build directory was not found."

            Write-Host "Searching for OpenCV files:"
            Get-ChildItem C:\opencv -Recurse |
              Select-Object FullName

            exit 1
          }

          Write-Host "Found OpenCV build directory:"
          Write-Host $build.FullName

          if ($build.FullName -ne "C:\opencv\build") {

            New-Item -ItemType Directory -Force `
              -Path C:\opencv | Out-Null

            Copy-Item `
              "$($build.FullName)\*" `
              "C:\opencv\build" `
              -Recurse `
              -Force
          }

          Write-Host "Final OpenCV directory:"
          Get-ChildItem C:\opencv\build


      # --------------------------------------------------
      # 9. Verify OpenCV
      # --------------------------------------------------
      - name: Verify OpenCV
        shell: powershell
        run: |
          if (!(Test-Path "C:\opencv\build\include\opencv2")) {
            Write-Error "OpenCV headers not found."
            exit 1
          }

          Write-Host "OpenCV headers found."

          Get-ChildItem C:\opencv\build\include\opencv2 |
            Select-Object Name


      # --------------------------------------------------
      # 10. Configure MSYS2 Bash
      # --------------------------------------------------
      - name: Configure Bash
        shell: powershell
        run: |
          echo "BAZEL_SH=C:\msys64\usr\bin\bash.exe" >> $env:GITHUB_ENV

          $env:BAZEL_SH = "C:\msys64\usr\bin\bash.exe"

          Write-Host "BAZEL_SH:"
          Write-Host $env:BAZEL_SH


      # --------------------------------------------------
      # 11. Configure Visual Studio
      # --------------------------------------------------
      - name: Configure Visual Studio
        shell: powershell
        run: |
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest `
            -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath

          if (!$vsPath) {
            Write-Error "Visual Studio C++ tools were not found."
            exit 1
          }

          Write-Host "Visual Studio:"
          Write-Host $vsPath

          echo "BAZEL_VC=$vsPath\VC" >> $env:GITHUB_ENV


      # --------------------------------------------------
      # 12. Disable Bzlmod
      #
      # This prevents the Swift dependency from being
      # pulled in through the module system.
      # --------------------------------------------------
      - name: Configure Bazel
        shell: powershell
        working-directory: C:\mediapipe
        run: |
          @"
          common --noenable_bzlmod
          common --enable_workspace
          "@ | Set-Content .bazelrc.local

          Write-Host ".bazelrc.local:"
          Get-Content .bazelrc.local


      # --------------------------------------------------
      # 13. Check Bazel
      # --------------------------------------------------
      - name: Check Bazel
        shell: cmd
        working-directory: C:\mediapipe
        run: |
          bazel --version


      # --------------------------------------------------
      # 14. Build MediaPipe Hand Tracking CPU
      # --------------------------------------------------
      - name: Build Hand Tracking
        shell: cmd
        working-directory: C:\mediapipe
        env:
          PYTHON_BIN_PATH: C:\hostedtoolcache\windows\Python\3.10.0\x64\python.exe
        run: |
          bazel build ^
            -c opt ^
            --define MEDIAPIPE_DISABLE_GPU=1 ^
            --action_env PYTHON_BIN_PATH="%pythonLocation%\python.exe" ^
            --enable_runfiles ^
            --verbose_failures ^
            //mediapipe/examples/desktop/hand_tracking:hand_tracking_cpu


      # --------------------------------------------------
      # 15. Show generated files
      # --------------------------------------------------
      - name: Find executable
        shell: powershell
        working-directory: C:\mediapipe
        run: |
          Write-Host "Searching for hand_tracking_cpu.exe..."

          Get-ChildItem C:\mediapipe\bazel-bin `
            -Recurse `
            -Filter "hand_tracking_cpu.exe" |
            Select-Object FullName


      # --------------------------------------------------
      # 16. Upload build artifact
      # --------------------------------------------------
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: mediapipe-hand-tracking-windows
          path: |
            C:\mediapipe\bazel-bin\**\hand_tracking_cpu.exe
