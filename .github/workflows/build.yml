name: Build Windows MediaPipe

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. Python
      # ============================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"


      # ============================================================
      # 3. MSYS2
      # ============================================================
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            make
            patch
            diffutils


      # ============================================================
      # 4. Bazelisk
      # ============================================================
      - name: Install Bazelisk
        shell: powershell
        run: |
          choco install bazelisk -y

          Write-Host "Bazel version:"
          bazel --version


      # ============================================================
      # 5. Clone MediaPipe
      # ============================================================
      - name: Clone MediaPipe
        shell: powershell
        run: |
          git clone `
            --depth 1 `
            https://github.com/google-ai-edge/mediapipe.git


      # ============================================================
      # 6. Install OpenCV
      #
      # MediaPipe's Windows WORKSPACE expects:
      #
      #     C:\opencv\build
      #
      # ============================================================
      - name: Install OpenCV
        shell: powershell
        run: |

          $opencvVersion = "4.5.5"

          $opencvUrl = `
            "https://github.com/opencv/opencv/releases/download/$opencvVersion/opencv-$opencvVersion-vc14_vc15.exe"

          $installer = "$env:RUNNER_TEMP\opencv-installer.exe"

          Write-Host "Downloading OpenCV $opencvVersion..."
          Write-Host $opencvUrl

          Invoke-WebRequest `
            -Uri $opencvUrl `
            -OutFile $installer

          if (-not (Test-Path $installer)) {
            Write-Error "OpenCV installer was not downloaded."
            exit 1
          }

          Write-Host "Installing OpenCV..."

          Start-Process `
            -FilePath $installer `
            -ArgumentList "/silent", "/dir=C:\opencv" `
            -Wait `
            -NoNewWindow

          Write-Host ""
          Write-Host "Checking C:\opencv..."

          if (-not (Test-Path "C:\opencv")) {
            Write-Error "C:\opencv does not exist."
            exit 1
          }

          Write-Host ""
          Write-Host "OpenCV directory:"
          Get-ChildItem "C:\opencv"


      # ============================================================
      # 7. Verify OpenCV
      # ============================================================
      - name: Verify OpenCV
        shell: powershell
        run: |

          Write-Host "Checking C:\opencv\build..."

          if (-not (Test-Path "C:\opencv\build")) {
            Write-Error "C:\opencv\build does not exist."
            exit 1
          }

          Write-Host ""
          Write-Host "OpenCV build directory:"
          Get-ChildItem "C:\opencv\build"


      # ============================================================
      # 8. Locate Swift
      #
      # We do NOT download Swift here.
      #
      # If the GitHub runner already has swiftc.exe available,
      # expose it to Bazel.
      # ============================================================
      - name: Locate Swift
        shell: powershell
        run: |

          Write-Host "Searching for swiftc.exe..."

          $swiftc = Get-ChildItem `
            -Path "C:\Program Files", "C:\Program Files (x86)" `
            -Filter "swiftc.exe" `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($swiftc) {

            Write-Host "Swift found:"
            Write-Host $swiftc.FullName

            echo $swiftc.Directory.FullName >> $env:GITHUB_PATH

          }
          else {

            Write-Host "swiftc.exe was not found on the runner."
            Write-Host "Continuing because the current MediaPipe configuration may not require it."

          }


      # ============================================================
      # 9. Configure Bazel environment
      # ============================================================
      - name: Configure Bazel
        shell: powershell
        run: |

          echo "BAZEL_SH=C:\msys64\usr\bin\bash.exe" >> $env:GITHUB_ENV

          $vsPaths = @(
            "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC",
            "C:\Program Files\Microsoft Visual Studio\2022\Professional\VC",
            "C:\Program Files\Microsoft Visual Studio\2022\Community\VC"
          )

          $found = $false

          foreach ($path in $vsPaths) {

            if (Test-Path $path) {

              Write-Host "Visual Studio C++ found:"
              Write-Host $path

              echo "BAZEL_VC=$path" >> $env:GITHUB_ENV

              $found = $true
              break

            }
          }

          if (-not $found) {
            Write-Error "Visual Studio C++ toolchain was not found."
            exit 1
          }


      # ============================================================
      # 10. Verify complete build environment
      # ============================================================
      - name: Verify environment
        shell: powershell
        run: |

          Write-Host "========================================"
          Write-Host "Python"
          Write-Host "========================================"

          python --version


          Write-Host ""
          Write-Host "========================================"
          Write-Host "Bazel"
          Write-Host "========================================"

          bazel --version


          Write-Host ""
          Write-Host "========================================"
          Write-Host "MSYS2"
          Write-Host "========================================"

          if (-not (Test-Path "C:\msys64\usr\bin\bash.exe")) {
            Write-Error "MSYS2 bash.exe not found."
            exit 1
          }

          Write-Host "MSYS2 OK"


          Write-Host ""
          Write-Host "========================================"
          Write-Host "OpenCV"
          Write-Host "========================================"

          if (-not (Test-Path "C:\opencv\build")) {
            Write-Error "OpenCV build directory missing."
            exit 1
          }

          Write-Host "OpenCV OK"


          Write-Host ""
          Write-Host "========================================"
          Write-Host "Swift"
          Write-Host "========================================"

          where.exe swiftc

          if ($LASTEXITCODE -eq 0) {
            swiftc --version
          }
          else {
            Write-Host "Swift compiler not available."
          }


      # ============================================================
      # 11. Build MediaPipe
      # ============================================================
      - name: Build Hand Tracking CPU
        shell: cmd
        working-directory: mediapipe
        run: |

          bazel build ^
            -c opt ^
            --define MEDIAPIPE_DISABLE_GPU=1 ^
            --enable_runfiles ^
            --features=compiler_param_file ^
            --verbose_failures ^
            //mediapipe/examples/desktop/hand_tracking:hand_tracking_cpu


      # ============================================================
      # 12. Display output
      # ============================================================
      - name: Show build output
        shell: powershell
        run: |

          Write-Host ""
          Write-Host "========================================"
          Write-Host "EXE FILES"
          Write-Host "========================================"

          Get-ChildItem `
            "mediapipe\bazel-bin" `
            -Recurse `
            -Filter "*.exe" `
            -ErrorAction SilentlyContinue


          Write-Host ""
          Write-Host "========================================"
          Write-Host "DLL FILES"
          Write-Host "========================================"

          Get-ChildItem `
            "mediapipe\bazel-bin" `
            -Recurse `
            -Filter "*.dll" `
            -ErrorAction SilentlyContinue


          Write-Host ""
          Write-Host "========================================"
          Write-Host "LIB FILES"
          Write-Host "========================================"

          Get-ChildItem `
            "mediapipe\bazel-bin" `
            -Recurse `
            -Filter "*.lib" `
            -ErrorAction SilentlyContinue


      # ============================================================
      # 13. Upload artifacts
      # ============================================================
      - name: Upload MediaPipe binaries
        uses: actions/upload-artifact@v4
        with:
          name: mediapipe-windows-hand-tracking
          path: |
            mediapipe/bazel-bin/**/*.exe
            mediapipe/bazel-bin/**/*.dll
            mediapipe/bazel-bin/**/*.lib
          if-no-files-found: warn
          retention-days: 14
