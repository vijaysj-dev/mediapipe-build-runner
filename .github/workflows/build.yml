name: Build Windows MediaPipe

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022

    steps:

      # --------------------------------------------------
      # Checkout
      # --------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4


      # --------------------------------------------------
      # Python
      # --------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"


      # --------------------------------------------------
      # MSYS2
      # --------------------------------------------------
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            patch
            unzip


      # --------------------------------------------------
      # Bazelisk
      # --------------------------------------------------
      - name: Install Bazelisk
        shell: powershell
        run: |
          choco install bazelisk -y
          bazel --version


      # --------------------------------------------------
      # Clone MediaPipe
      # --------------------------------------------------
      - name: Clone MediaPipe
        shell: powershell
        run: |
          git clone `
            --depth 1 `
            --branch v0.10.21 `
            https://github.com/google-ai-edge/mediapipe.git


      # --------------------------------------------------
      # Disable Bzlmod
      # --------------------------------------------------
      - name: Disable Bzlmod
        shell: powershell
        working-directory: mediapipe
        run: |

          Write-Host "Creating .bazelrc.local"

          @"
          common --noenable_bzlmod
          common --enable_workspace
          "@ | Out-File `
            -FilePath ".bazelrc.local" `
            -Encoding ascii


      # --------------------------------------------------
      # Verify MediaPipe configuration
      # --------------------------------------------------
      - name: Check MediaPipe
        shell: powershell
        working-directory: mediapipe
        run: |

          Write-Host "MediaPipe commit:"
          git rev-parse HEAD

          Write-Host ""
          Write-Host "Bazel configuration:"
          Get-Content .bazelrc.local


      # --------------------------------------------------
      # Configure Bazel
      # --------------------------------------------------
      - name: Configure Bazel environment
        shell: powershell
        run: |

          echo "BAZEL_SH=C:\msys64\usr\bin\bash.exe" >> $env:GITHUB_ENV

          $vsPaths = @(
            "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC",
            "C:\Program Files\Microsoft Visual Studio\2022\Professional\VC",
            "C:\Program Files\Microsoft Visual Studio\2022\Community\VC"
          )

          foreach ($path in $vsPaths) {

            if (Test-Path $path) {

              Write-Host "Using:"
              Write-Host $path

              echo "BAZEL_VC=$path" >> $env:GITHUB_ENV

              break
            }
          }


      # --------------------------------------------------
      # Build
      # --------------------------------------------------
      - name: Build Hand Tracking CPU
        shell: cmd
        working-directory: mediapipe
        run: |

          bazel build ^
            -c opt ^
            --define MEDIAPIPE_DISABLE_GPU=1 ^
            --action_env=PYTHON_BIN_PATH=%pythonLocation%\python.exe ^
            --shell_executable=C:\msys64\usr\bin\bash.exe ^
            --verbose_failures ^
            //mediapipe/examples/desktop/hand_tracking:hand_tracking_cpu


      # --------------------------------------------------
      # List output
      # --------------------------------------------------
      - name: List binaries
        shell: powershell
        run: |

          Write-Host "=== EXE ==="

          Get-ChildItem `
            mediapipe\bazel-bin `
            -Recurse `
            -Filter "*.exe" `
            -ErrorAction SilentlyContinue


          Write-Host ""
          Write-Host "=== DLL ==="

          Get-ChildItem `
            mediapipe\bazel-bin `
            -Recurse `
            -Filter "*.dll" `
            -ErrorAction SilentlyContinue


          Write-Host ""
          Write-Host "=== LIB ==="

          Get-ChildItem `
            mediapipe\bazel-bin `
            -Recurse `
            -Filter "*.lib" `
            -ErrorAction SilentlyContinue


      # --------------------------------------------------
      # Upload
      # --------------------------------------------------
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: mediapipe-windows-hand-tracking
          path: |
            mediapipe/bazel-bin/**/*.exe
            mediapipe/bazel-bin/**/*.dll
            mediapipe/bazel-bin/**/*.lib
          if-no-files-found: warn
          retention-days: 14
