name: Build Windows MediaPipe DLL

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Bazelisk and MSYS2
      run: |
        choco install bazelisk -y
        bazel --version

    # Bypass the rules_swift check by putting a dummy swiftc.exe in PATH
    - name: Bypass Swift Autoconfig
      shell: cmd
      run: |
        mkdir C:\dummy_swift
        type nul > C:\dummy_swift\swiftc.exe
        echo C:\dummy_swift>> %GITHUB_PATH%

    - name: Clone MediaPipe Repo
      run: |
        git clone --depth 1 https://github.com/google-ai-edge/mediapipe.git

    - name: Build MediaPipe DLL Target
      shell: cmd
      run: |
        cd mediapipe
        set BAZEL_SH=C:\msys64\usr\bin\bash.exe
        set BAZEL_VC=C:\Program Files\Microsoft Visual Studio\2022\Community\VC
        
        bazel build -c opt ^
          --define MEDIAPIPE_DISABLE_GPU=1 ^
          --enable_runfiles ^
          --features=compiler_param_file ^
          //mediapipe/examples/desktop/hand_tracking:hand_tracking_cpu

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: mediapipe-windows-binaries
        path: |
          mediapipe/bazel-bin/**/*.dll
          mediapipe/bazel-bin/**/*.lib
          mediapipe/bazel-bin/**/*.exe
        retention-days: 14
