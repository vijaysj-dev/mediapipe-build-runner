name: Build Windows MediaPipe

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      # ------------------------------------------------------------
      # 1. Checkout your repository
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # 2. Python
      # ------------------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install numpy

      # ------------------------------------------------------------
      # 3. MSYS2
      # ------------------------------------------------------------
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            patch
            diffutils
            make

      # ------------------------------------------------------------
      # 4. Bazelisk
      # ------------------------------------------------------------
      - name: Install Bazelisk
        shell: powershell
        run: |
          choco install bazelisk -y

          Write-Host "Bazel version:"
          bazel --version

      # ------------------------------------------------------------
      # 5. Install Swift
      #
      # rules_swift requires swiftc.exe on Windows.
      # ------------------------------------------------------------
      - name: Install Swift
        shell: powershell
        run: |
          choco install swift -y

          refreshenv

          Write-Host "Searching for swiftc.exe..."

          $swiftc = Get-ChildItem `
            -Path "C:\Program Files", "C:\Swift", "C:\Library" `
            -Filter "swiftc.exe" `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $swiftc) {
            Write-Error "swiftc.exe was not found."
            exit 1
          }

          Write-Host "Found Swift:"
          Write-Host $swiftc.FullName

          $swiftBin = $swiftc.Directory.FullName

          Write-Host "Swift bin:"
          Write-Host $swiftBin

          echo "$swiftBin" >> $env:GITHUB_PATH

      # ------------------------------------------------------------
      # 6. Verify Swift
      # ------------------------------------------------------------
      - name: Verify Swift
        shell: powershell
        run: |
          refreshenv

          where.exe swiftc

          if ($LASTEXITCODE -ne 0) {
            Write-Error "swiftc.exe is not in PATH."
            exit 1
          }

          swiftc --version

      # ------------------------------------------------------------
      # 7. Clone MediaPipe
      #
      # v0.10.21 is a known MediaPipe Windows-era release.
      # ------------------------------------------------------------
      - name: Clone MediaPipe
        shell: powershell
        run: |
          git clone --depth 1 --branch v0.10.21 `
            https://github.com/google-ai-edge/mediapipe.git

      # ------------------------------------------------------------
      # 8. Configure Bazel environment
      # ------------------------------------------------------------
      - name: Configure Bazel
        shell: powershell
        run: |
          echo "BAZEL_SH=C:\msys64\usr\bin\bash.exe" >> $env:GITHUB_ENV

          $vsPaths = @(
            "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC",
            "C:\Program Files\Microsoft Visual Studio\2022\Professional\VC",
            "C:\Program Files\Microsoft Visual Studio\2022\Community\VC"
          )

          foreach ($path in $vsPaths) {
            if (Test-Path $path) {
              Write-Host "Using Visual C++ toolchain:"
              Write-Host $path
              echo "BAZEL_VC=$path" >> $env:GITHUB_ENV
              break
            }
          }

      # ------------------------------------------------------------
      # 9. Verify build tools
      # ------------------------------------------------------------
      - name: Verify build environment
        shell: powershell
        run: |
          Write-Host "Python:"
          python --version

          Write-Host ""
          Write-Host "Bazel:"
          bazel --version

          Write-Host ""
          Write-Host "Swift:"
          swiftc --version

          Write-Host ""
          Write-Host "MSYS2:"
          if (-not (Test-Path "C:\msys64\usr\bin\bash.exe")) {
            Write-Error "MSYS2 bash.exe not found."
            exit 1
          }

          Write-Host "MSYS2 OK"

      # ------------------------------------------------------------
      # 10. Build MediaPipe Hand Tracking CPU
      # ------------------------------------------------------------
      - name: Build MediaPipe Hand Tracking CPU
        shell: cmd
        working-directory: mediapipe
        run: |
          bazel build ^
            -c opt ^
            --define MEDIAPIPE_DISABLE_GPU=1 ^
            --action_env=PYTHON_BIN_PATH=C:\hostedtoolcache\windows\Python\3.11.0\x64\python.exe ^
            --shell_executable=C:\msys64\usr\bin\bash.exe ^
            //mediapipe/examples/desktop/hand_tracking:hand_tracking_cpu

      # ------------------------------------------------------------
      # 11. Show generated files
      # ------------------------------------------------------------
      - name: List build output
        shell: powershell
        run: |
          Write-Host "===== EXE ====="
          Get-ChildItem `
            "mediapipe\bazel-bin" `
            -Recurse `
            -Filter "*.exe" `
            -ErrorAction SilentlyContinue

          Write-Host ""
          Write-Host "===== DLL ====="
          Get-ChildItem `
            "mediapipe\bazel-bin" `
            -Recurse `
            -Filter "*.dll" `
            -ErrorAction SilentlyContinue

          Write-Host ""
          Write-Host "===== LIB ====="
          Get-ChildItem `
            "mediapipe\bazel-bin" `
            -Recurse `
            -Filter "*.lib" `
            -ErrorAction SilentlyContinue

      # ------------------------------------------------------------
      # 12. Upload binaries
      # ------------------------------------------------------------
      - name: Upload MediaPipe binaries
        uses: actions/upload-artifact@v4
        with:
          name: mediapipe-windows-hand-tracking
          path: |
            mediapipe/bazel-bin/**/*.exe
            mediapipe/bazel-bin/**/*.dll
            mediapipe/bazel-bin/**/*.lib
          if-no-files-found: warn
          retention-days: 14
